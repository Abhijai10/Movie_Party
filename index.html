<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Party</title>
    <style>
      /* ── Boot splash ─────────────────────────────────────────────
         Paints before the JS bundle arrives, so the window opens
         instantly with the app's own background instead of a blank
         transparent frame. React removes the node on mount
         (see src/main.tsx). Zero dependencies, system fonts only —
         webfonts arrive with the bundle. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05050b;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background:
          radial-gradient(ellipse 70% 50% at 50% 20%, rgba(107, 70, 193, 0.18), transparent 60%),
          #05050b;
        color: #ede9f7;
        font-family: Georgia, "Times New Roman", serif;
        -webkit-font-smoothing: antialiased;
      }
      #boot-splash .wordmark {
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      #boot-splash .wordmark .amp {
        font-style: italic;
        color: #b8a5f0;
      }
      #boot-splash .status {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-size: 12.5px;
        letter-spacing: 0.04em;
        color: rgba(237, 233, 247, 0.52);
      }
      #boot-splash .bar {
        width: 148px;
        height: 2px;
        border-radius: 2px;
        background: rgba(159, 122, 234, 0.18);
        overflow: hidden;
      }
      #boot-splash .bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 2px;
        background: #9f7aea;
        animation: mp-boot-slide 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes mp-boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(290%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bar::after {
          animation: none;
          transform: none;
          width: 100%;
          background: rgba(159, 122, 234, 0.5);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <div class="wordmark">Movie <span class="amp">&amp;</span> Party</div>
      <div class="bar"></div>
      <div class="status">Starting Movie Party…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
