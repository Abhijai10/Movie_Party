[package]
name = "move-party"
version = "0.1.0"
description = "Private two-person desktop cinema app"
authors = ["Move Party"]
edition = "2021"
license = "LicenseRef-Proprietary"

[lib]
name = "move_party_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
