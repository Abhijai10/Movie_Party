[package]
name = "movie-party"
version = "0.9.8"
description = "Private two-person desktop cinema app"
authors = ["Movie Party"]
edition = "2021"
license = "LicenseRef-Proprietary"

[lib]
name = "movie_party_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["mpv"]
mpv = ["dep:libloading"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-util", "process"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls"] }
rcgen = "0.14"
rustls = "0.23"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
uuid = { version = "1", features = ["v7", "serde"] }
blake3 = "1"
ed25519-dalek = "2"
libloading = { version = "0.8", optional = true }
rfd = "0.15"
rusqlite = { version = "0.31", features = ["bundled"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
# MP-19: a real URL parser for the provider/generic-link destination checks.
# Splitting the authority text by hand let `https://x@127.0.0.1:8080/` read as
# a public host. Already in the graph transitively (via tauri), so this adds
# no new code to the build.
url = "2"

# Managed-Chrome process-tree ownership (see providers/chrome/process.rs).
# Both crates are already in the dependency graph at these versions via
# transitive dependencies, so this adds no new code to the build — it only
# makes the ones we actually call explicit.
[target.'cfg(unix)'.dependencies]
# killpg/signal/getpgrp for whole-tree teardown of the Chrome process group.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# A kill-on-close job object is the only mechanism that terminates the Chrome
# tree when Movie Party itself dies without running cleanup (MP-23).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
