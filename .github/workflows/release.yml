name: Release

# v0.9.4+: official tauri-action release workflow. Builds the macOS
# Apple Silicon bundle and the Windows x64 NSIS installer on a version
# tag and publishes them to a GitHub Release.
#
# Trigger: push a v* tag (never retag — create a new patch version
# instead). The workflow does NOT run on branches or plain commits.
on:
  push:
    tags:
      - "v*"
  # Manual dispatch: releases the code at the selected ref. Used when a
  # tag's workflow needed a fix after the tag was pushed (tags are never
  # re-created); dispatch against the same code on main and the artifacts
  # attach to the same tagName. tauri-action appends to an existing
  # release, so re-dispatching never duplicates artifacts.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.9.4)"
        required: true
        default: "v0.9.4"
      only:
        description: "Build only this OS leg (macos / windows / all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - macos
          - windows

permissions:
  contents: write

jobs:
  # ADV-03: the version gate must run HERE, on the only path that publishes.
  #
  # AUD-09 added the check to `ci.yml`, which is `workflow_dispatch`-only — so it
  # never ran on a tag push, and a tag whose four version declarations disagreed
  # would have published a mislabelled release with the gate sitting green.
  # `publish-tauri` now depends on this, so a mismatch blocks the publish instead
  # of being discovered afterwards. The check itself lives in one reusable
  # workflow shared with `ci.yml`.
  version-consistency:
    uses: ./.github/workflows/version-consistency.yml

  # Resolve which matrix legs to build. Dispatch can target a single OS
  # (e.g. rebuild just macOS after a staging fix without paying for the
  # Windows build again); tag pushes always build everything. Computed
  # here because `matrix` is not available in a job-level `if`.
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.pick.outputs.legs }}
    steps:
      - id: pick
        shell: bash
        run: |
          MACOS='{"os":"macos-latest","args":"--target aarch64-apple-darwin","rust_target":"aarch64-apple-darwin"}'
          WINDOWS='{"os":"windows-latest","args":"","rust_target":"x86_64-pc-windows-msvc"}'
          ONLY="${{ github.event_name == 'workflow_dispatch' && inputs.only || 'all' }}"
          case "$ONLY" in
            macos)   LEGS="[$MACOS]" ;;
            windows) LEGS="[$WINDOWS]" ;;
            *)       LEGS="[$MACOS,$WINDOWS]" ;;
          esac
          echo "legs=$LEGS" >> "$GITHUB_OUTPUT"
          echo "Building legs: $LEGS"

  publish-tauri:
    name: Release ${{ matrix.os }}
    needs: [resolve-matrix, version-consistency]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.legs) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      # Pinned toolchain — same rationale as ci.yml: never let the build
      # toolchain drift from what the code was verified against.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # ── Stage the mpv runtime (NOT committed; LGPL distribution is
      #    handled by the committed license texts) ──────────────────────
      # macOS: the reproducible LGPL build. Homebrew's mpv is GPL and
      # CANNOT be bundled in this proprietary app; build-libmpv-macos.sh
      # compiles LGPL ffmpeg/libplacebo/harfbuzz/libass/libmpv from
      # pinned sources with @loader_path-relative install names. Slow
      # (~20-40 min) but license-correct and reproducible.
      - name: Stage LGPL libmpv runtime (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install meson ninja pkg-config freetype fribidi libpng \
            brotli gettext pcre2 glib
          # glad2 (+ jinja2/markupsafe, needed by libplacebo's OpenGL
          # loader generation) are pip packages, not brew formulae. They
          # go into a venv; build-libmpv-macos.sh points meson at them
          # via MPV_PYTHONPATH (a venv site-packages dir works for that).
          python3 -m venv /tmp/mpv-venv
          /tmp/mpv-venv/bin/pip install --quiet glad2 jinja2 markupsafe
          # Declare and assign separately, then verify. `export X="$(cmd)"` is
          # SC2155: the declaration's own status masks the substitution's, so
          # under `set -e` a failing lookup does NOT abort the step. It would
          # leave MPV_PYTHONPATH empty, libplacebo's meson would then build
          # WITHOUT the OpenGL loader glad2 provides, and the release would ship
          # that libmpv — with no test in this workflow able to notice, because
          # the real-libmpv tests are skipped here. Fail loudly instead.
          MPV_PYTHONPATH="$(/tmp/mpv-venv/bin/python -c 'import glad; import os; print(os.path.dirname(os.path.dirname(glad.__file__)))')"
          if [ -z "$MPV_PYTHONPATH" ]; then
            echo "::error title=glad2 not importable::MPV_PYTHONPATH came back empty, so libplacebo would be built without its OpenGL loader. Refusing to build a libmpv that cannot be trusted."
            exit 1
          fi
          export MPV_PYTHONPATH
          echo "MPV_PYTHONPATH=$MPV_PYTHONPATH"
          bash ./scripts/build-libmpv-macos.sh
          ls -la src-tauri/mpv_runtime/

      # Windows: mpv-winbuild-cmake's dev archive ships a fully
      # self-contained LGPL-build libmpv-2.dll. We rename it to
      # mpv-2.dll, which is what src-tauri/src/media/player/mpv_backend.rs
      # loads at runtime, and stage it into src-tauri/mpv_runtime/ so the
      # NSIS bundle picks it up as a Tauri resource.
      - name: Stage libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mpvRelease = "20260830"
          $mpvAsset = "mpv-dev-x86_64-20260830-git-e8673660ab.7z"
          # SHA-256 of that exact asset, as published by GitHub for this
          # release. Verified below before anything is extracted: the DLL this
          # stages is bundled into the Windows installer and shipped, and pinning
          # the *name* does not pin the *bytes* -- an asset replaced at the same
          # URL would otherwise be staged silently. (Found by the
          # post-remediation adversarial audit, ADV-08.)
          $mpvSha256 = "7310560BD25CC760282E8754A389302629C6E748261030C3870E1CB2F80CDC48"
          $mpvUrl = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$mpvRelease/$mpvAsset"
          $archive = Join-Path $env:RUNNER_TEMP "mpv-dev.7z"
          $extract = Join-Path $env:RUNNER_TEMP "mpv-dev"
          Invoke-WebRequest -Uri $mpvUrl -OutFile $archive
          $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash
          if ($actualHash -ne $mpvSha256) {
            throw "libmpv archive failed its integrity check: expected $mpvSha256 but got $actualHash. Refusing to stage an unverified DLL."
          }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" x $archive "-o$extract" -y | Out-Null
          $dll = Get-ChildItem -Path $extract -Recurse -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll was not found in the downloaded archive" }
          $stageDir = "src-tauri/mpv_runtime"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item $dll.FullName (Join-Path $stageDir "mpv-2.dll") -Force
          Get-Item (Join-Path $stageDir "mpv-2.dll") | Select-Object Name, Length

      - run: pnpm install --frozen-lockfile

      # VITE_TMDB_TOKEN (repo secret, never committed): the SHARED key
      # baked into every release build as the default TMDB credential.
      # Vite inlines it into the frontend bundle via beforeBuildCommand,
      # so both installs (owner + friend) get posters out of the box. A
      # key pasted in Settings always overrides it per device, so a
      # retired shared key never strands an install.
      # ── Release body: derived from the tag's own notes, never hardcoded ──
      # The previous body was a hardcoded string matching the v0.9.5 section
      # of RELEASE_NOTES.md verbatim, and it was reused unchanged for v0.9.5,
      # v0.9.6 AND v0.9.8 — so three consecutive releases advertised v0.9.5's
      # changes and said nothing about their own. The body is now extracted
      # from the tag's own section, and a missing section FAILS the release
      # rather than publishing a stale or empty one.
      - name: Derive the release body from RELEASE_NOTES.md
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Deriving release notes for version '$VERSION' (tag '$TAG')"

          SECTION="$(mktemp)"
          BODY="$(mktemp)"

          # The section runs from the exact "## <version>" heading to the next
          # "## " heading. The boundary check stops 0.9.8 matching 0.9.80.
          awk -v pre="## $VERSION" '
            {
              if (inside) {
                if (substr($0, 1, 3) == "## ") exit
                print; next
              }
              if (substr($0, 1, length(pre)) == pre) {
                rest = substr($0, length(pre) + 1, 1)
                if (rest == "" || rest == " " || rest == "(") { inside = 1 }
              }
            }
          ' RELEASE_NOTES.md > "$SECTION"

          if [ ! -s "$SECTION" ]; then
            echo "::error title=No release notes section::RELEASE_NOTES.md has no '## $VERSION' section, so the release body cannot be derived. Add that section before releasing — a release must not ship notes for a different version."
            exit 1
          fi

          if [ ! -f docs/RELEASE_BODY_FOOTER.md ]; then
            echo "::error title=Missing release body footer::docs/RELEASE_BODY_FOOTER.md is missing. It carries the downloads table, the macOS Gatekeeper first-launch instructions and the no-auto-update statement."
            exit 1
          fi

          # Versioned changelog from RELEASE_NOTES.md + the release-mechanics
          # block that is the same for every release.
          cat "$SECTION" docs/RELEASE_BODY_FOOTER.md > "$BODY"

          {
            echo "body<<__MOVIE_PARTY_RELEASE_BODY__"
            cat "$BODY"
            echo "__MOVIE_PARTY_RELEASE_BODY__"
          } >> "$GITHUB_OUTPUT"

          echo "Release body derived: $(wc -l < "$BODY") lines"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_TMDB_TOKEN: ${{ secrets.VITE_TMDB_TOKEN }}
        with:
          # On a tag push the tag is the ref name; on a manual dispatch
          # the operator names the release tag (must already exist so
          # the artifacts land on the intended release).
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "Movie Party ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          # Derived from the tag's own RELEASE_NOTES.md section by the step
          # above. Do NOT paste a body here again: a hardcoded body is how
          # v0.9.5/v0.9.6/v0.9.8 all ended up describing v0.9.5.
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
