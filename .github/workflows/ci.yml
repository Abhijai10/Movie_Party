name: CI

# Manual-only: this workflow never runs automatically on push/PR. CI consumes
# Actions minutes — run it deliberately from the Actions tab or with:
#   gh workflow run ci.yml --ref <branch-or-tag>
on:
  workflow_dispatch:

jobs:
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # AUD-09: the application version is declared in four places and nothing
      # enforced that they agree. A tag push with three of four bumped would
      # ship a build labelled with a version it is not. Cheap, so it runs first.
      - name: All four version declarations must agree
        run: |
          set -euo pipefail
          pkg=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          tauri=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          lock=$(awk '/^name = "movie-party"$/{getline; if ($1=="version") {gsub(/"/,"",$3); print $3; exit}}' Cargo.lock)
          printf '%-28s %s\n' package.json "$pkg" src-tauri/tauri.conf.json "$tauri" src-tauri/Cargo.toml "$cargo" Cargo.lock "$lock"
          for entry in "src-tauri/tauri.conf.json=$tauri" "src-tauri/Cargo.toml=$cargo" "Cargo.lock=$lock"; do
            file="${entry%%=*}"; found="${entry#*=}"
            if [ -z "$found" ] || [ "$found" != "$pkg" ]; then
              echo "::error::version mismatch: $file declares '$found' but package.json declares '$pkg'"
              exit 1
            fi
          done
          echo "OK: all four version declarations agree ($pkg)"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      # Pinned toolchain: clippy's `-D warnings` gate must not drift from the
      # toolchain the code was verified against — the silent 1.96 → 1.98
      # stable drift is exactly what broke CI (new lints:
      # unneeded_wildcard_pattern, manual_is_multiple_of, manual_dangling_ptr).
      # Bump this pin deliberately after re-verifying locally.
      # NOTE: an explicit version installs with rustup's MINIMAL profile —
      # unlike the runner's preinstalled stable, it has no rustfmt/clippy,
      # so both components must be requested explicitly.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # Tests are serialized on hosted runners: the lib and integration
      # suites include AppRuntime tests that spin real loopback QUIC
      # endpoints + wake loops, and serial execution keeps their timing
      # windows comfortable on small virtualized runners.
      # --test-threads=1 changes scheduling, never assertions.
      #
      # NOTE (corrected root cause): `test_b_play_transitions_both_to_playing`
      # used to fail here with "host predicate not satisfied within 30s".
      # That was NOT a scheduling artifact and NOT a flake. SequenceTracker
      # (src-tauri/src/protocol/mod.rs) enforced a strict watermark
      # (`seq <= last` -> reject), while the sender allocates one `seq` per
      # request and each request travels on its OWN QUIC bidirectional stream
      # (QuicClient::send_request -> open_bi) — and QUIC guarantees no ordering
      # BETWEEN streams. `ready_both()` fires ReadyState + BufferStatus
      # concurrently, so the higher seq regularly arrived first, the loser was
      # rejected INVALID_SEQUENCE, the guest ignored it (`let _ =`), nothing
      # retried, and the host never recorded guest readiness. The 30s deadline
      # was a symptom.
      #
      # Fixed by a bounded reorder window (SEQUENCE_REORDER_WINDOW = 64) that
      # accepts a legitimate in-window reorder while still rejecting duplicates
      # and anything older than the window. If this test fails again, look for a
      # dropped message — do NOT raise the timeout.
      # ── The bundled libmpv runtime ────────────────────────────────────────
      # `src-tauri/mpv_runtime/*` is gitignored (large LGPL binaries), so a
      # clean checkout has no libmpv and this job cannot build one: the staging
      # script needs a local libmpv build (scripts/build-libmpv-macos.sh) and
      # Homebrew. That is a real, structural limitation — see BATCH5_REPORT.md.
      #
      # What changed in Batch 5: the bundled_libmpv_* tests no longer `return`
      # early when the runtime is missing. They used to report `ok` in 0.00s
      # without executing a single assertion — a false green. They now FAIL
      # loudly (src-tauri/tests/common/mod.rs), which means this job must skip
      # them EXPLICITLY and say so, rather than quietly collecting a pass it
      # never earned.
      #
      # On a machine with the runtime staged, run them for real with:
      #   cargo test --test real_playback_smoke_test \
      #              --test real_native_surface_e2e \
      #              --test real_sw_render_test -- --test-threads=1 --nocapture
      - name: libmpv runtime state
        shell: bash
        run: |
          if [ -f mpv_runtime/libmpv.dylib ] || [ -f mpv_runtime/libmpv.dll ]; then
            echo "BUNDLED_LIBMPV=1" >> "$GITHUB_ENV"
            echo "libmpv runtime present — the bundled_libmpv_* tests will execute."
          else
            echo "BUNDLED_LIBMPV=0" >> "$GITHUB_ENV"
            echo "::warning title=Real playback tests SKIPPED::No bundled libmpv runtime was staged, so the bundled_libmpv_* tests (real_playback_smoke_test, real_native_surface_e2e, real_sw_render_test, windows_native_surface_e2e) DO NOT EXECUTE in this job. They are reported as an explicit skip, not a pass. Stage the runtime with scripts/stage-libmpv-macos.sh (needs a local libmpv build) to run them."
          fi

      - name: Tests
        shell: bash
        run: |
          if [ "$BUNDLED_LIBMPV" = "1" ]; then
            cargo test -- --test-threads=1
          else
            # Named individually rather than by a `bundled_libmpv_` prefix, so
            # `bundled_libmpv_path_resolves_correctly_inside_app_bundle` — which
            # is pure path-string logic and needs no runtime — still runs.
            cargo test -- --test-threads=1 \
              --skip bundled_libmpv_plays_pauses_seeks_real_video \
              --skip bundled_libmpv_renders_onto_real_calayer_through_production_player \
              --skip bundled_libmpv_sw_render_api_produces_decoded_frames \
              --skip bundled_libmpv_renders_onto_real_child_hwnd_through_production_player \
              --skip bundled_runtime_is_loadable
            echo "EXPLICIT SKIP: the 5 libmpv-dependent tests above did not execute (no libmpv runtime in this job). The committed media fixture they need IS present; only the runtime is missing."
          fi

  # Dependency audits — ADVISORY, non-blocking by design. Failures surface
  # as warnings so a new advisory never blocks feature work; promotion to
  # blocking is a later, deliberate decision.
  cargo-audit:
    name: Cargo audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: cargo install cargo-audit --locked
      # The Cargo workspace root — and its Cargo.lock — is the repo root,
      # not src-tauri/. cargo audit from src-tauri/ failed with "Couldn't
      # load Cargo.lock"; audit the workspace from its root instead.
      - run: cargo audit
        working-directory: .

  pnpm-audit:
    name: pnpm audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
