name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download and stage libmpv (Windows)
        shell: pwsh
        run: |
          # mpv-winbuild-cmake dev archive ships a fully self-contained
          # libmpv-2.dll (exports the whole mpv client API, depends only on
          # Windows system DLLs + the Universal CRT). We rename it to
          # mpv-2.dll, which is what src-tauri/src/media/player/mpv_backend.rs
          # loads at runtime, and stage it into src-tauri/mpv_runtime/ so the
          # NSIS bundle picks it up as a Tauri resource.
          $mpvRelease = "20260830"
          $mpvAsset = "mpv-dev-x86_64-20260830-git-e8673660ab.7z"
          $mpvUrl = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$mpvRelease/$mpvAsset"
          $archive = Join-Path $env:RUNNER_TEMP "mpv-dev.7z"
          $extract = Join-Path $env:RUNNER_TEMP "mpv-dev"
          Invoke-WebRequest -Uri $mpvUrl -OutFile $archive
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" x $archive "-o$extract" -y | Out-Null
          $dll = Get-ChildItem -Path $extract -Recurse -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll was not found in the downloaded archive" }
          $stageDir = "src-tauri/mpv_runtime"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item $dll.FullName (Join-Path $stageDir "mpv-2.dll") -Force
          Get-Item (Join-Path $stageDir "mpv-2.dll") | Select-Object Name, Length

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Movie-Party-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          compression-level: 0

      - name: Attach installer to GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
