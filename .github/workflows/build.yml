name: Build Windows installer

# Manual-only: this workflow never runs automatically on tag push. The
# Windows build is the single most expensive job in the repo — run it
# deliberately from the Actions tab or with:
#   gh workflow run build.yml --ref <branch-or-tag>
# Dispatch against a tag ref to attach the installer to that tag's release:
#   gh workflow run build.yml --ref v0.9.0
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      # Pinned toolchain — see ci.yml for the rationale (never let the
      # build toolchain drift from what the code was verified against).
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download and stage libmpv (Windows)
        shell: pwsh
        run: |
          # mpv-winbuild-cmake dev archive ships a fully self-contained
          # libmpv-2.dll (exports the whole mpv client API, depends only on
          # Windows system DLLs + the Universal CRT). We rename it to
          # mpv-2.dll, which is what src-tauri/src/media/player/mpv_backend.rs
          # loads at runtime, and stage it into src-tauri/mpv_runtime/ so the
          # NSIS bundle picks it up as a Tauri resource.
          $mpvRelease = "20260830"
          $mpvAsset = "mpv-dev-x86_64-20260830-git-e8673660ab.7z"
          $mpvUrl = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$mpvRelease/$mpvAsset"
          $archive = Join-Path $env:RUNNER_TEMP "mpv-dev.7z"
          $extract = Join-Path $env:RUNNER_TEMP "mpv-dev"
          Invoke-WebRequest -Uri $mpvUrl -OutFile $archive
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" x $archive "-o$extract" -y | Out-Null
          $dll = Get-ChildItem -Path $extract -Recurse -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll was not found in the downloaded archive" }
          $stageDir = "src-tauri/mpv_runtime"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item $dll.FullName (Join-Path $stageDir "mpv-2.dll") -Force
          Get-Item (Join-Path $stageDir "mpv-2.dll") | Select-Object Name, Length

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Movie-Party-Windows-x64
          # The Cargo workspace root is the REPO root (root Cargo.toml with
          # members = ["src-tauri"]), so cargo emits all artifacts — the
          # bundled installer included — to <repo>/target, NOT
          # src-tauri/target. The previous src-tauri/target path matched
          # nothing: the installer built fine but was never uploaded.
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0

      - name: Attach installer to GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
